<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18222B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Listino">
  <meta name="robots" content="noindex, nofollow">
  <title>Listino in tasca</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Listino in tasca</span>
        <span class="brand-sub" id="listino-label">Nessun listino caricato</span>
      </div>
      <button class="icon-btn" data-action="open-settings" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.4 7.4 0 0 0-2.6-1.5L14.2 2.6h-4l-.3 2.5a7.4 7.4 0 0 0-2.6 1.5L5 5.6 3 9l2 1.5a7.6 7.6 0 0 0 0 3L3 15l2 3.4 2.3-1a7.4 7.4 0 0 0 2.6 1.5l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 2.6-1.5l2.3 1 2-3.4-2-1.5Z"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <button id="quote-bar" class="quote-bar" data-action="go" data-view="quote" hidden>
      <span class="qb-count" id="qb-count"></span>
      <span class="qb-total" id="qb-total"></span>
    </button>

    <nav class="tabbar" id="tabbar" aria-label="Sezioni">
      <button data-action="go" data-view="config" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="16" cy="6" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="10" cy="12" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        <span>Configura</span>
      </button>
      <button data-action="go" data-view="search" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Cerca</span>
      </button>
      <button data-action="go" data-view="quote" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M9 11h7M9 15h7M9 7h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Preventivo</span>
        <b class="badge" id="tab-badge" hidden></b>
      </button>
      <button data-action="go" data-view="archive" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span>Archivio</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" data-action="close-sheet"></div>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print-area" aria-hidden="true"></div>

  <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>

  <script src="lib/pdf.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pdfview.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
